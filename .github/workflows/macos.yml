# SPDX-License-Identifier: MPL-2.0
#
# Builds the macOS runtime and runs its tests, builds and tests the Apple Swift packages,
# and builds the Apple client apps unsigned. Platforms the runner cannot build are echoed
# as UNCHECKED rather than dropped.
name: macos

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runtime:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Metal device
        id: metal
        run: |
          sw_vers
          xcodebuild -version
          cat > "$RUNNER_TEMP/metal_probe.swift" <<'EOF'
          import Metal
          let device = MTLCreateSystemDefaultDevice()
          print("Metal device: \(device?.name ?? "none")")
          print("apple7=\(device?.supportsFamily(.apple7) == true ? "yes" : "no")")
          EOF
          swift "$RUNNER_TEMP/metal_probe.swift" | tee "$RUNNER_TEMP/metal_probe.txt"
          grep '^apple7=' "$RUNNER_TEMP/metal_probe.txt" >> "$GITHUB_OUTPUT"
      - name: Toolchain
        run: brew install ninja vulkan-headers vulkan-loader
      - name: Configure
        run: cmake --preset macos-arm64 -DOXRSYS_BUILD_QT_FRONTENDS=OFF
      - name: Qt frontends refused on macOS
        run: |
          if cmake -S . -B "$RUNNER_TEMP/qt-on" -G Ninja -DOXRSYS_BUILD_QT_FRONTENDS=ON > "$RUNNER_TEMP/qt-on.log" 2>&1; then
            echo "FAIL - configure with OXRSYS_BUILD_QT_FRONTENDS=ON succeeded on macOS"; exit 1
          fi
          grep -q "OXRSYS_BUILD_QT_FRONTENDS=ON is not supported on Apple platforms" "$RUNNER_TEMP/qt-on.log" || { cat "$RUNNER_TEMP/qt-on.log"; exit 1; }
          echo "PASS - configure refused OXRSYS_BUILD_QT_FRONTENDS=ON with the Apple message"
      - name: Build
        run: cmake --build build/macos-arm64
      - name: Test
        if: steps.metal.outputs.apple7 == 'yes'
        run: ctest --test-dir build/macos-arm64 --output-on-failure
      - name: Test, PyroWave round trip unchecked without an Apple7 GPU
        if: steps.metal.outputs.apple7 != 'yes'
        run: |
          echo "UNCHECKED 1 - oxrsys_pyrowave_tests needs a Metal device in GPU family Apple7, which PyroWave requires and this runner's device does not report"
          ctest --test-dir build/macos-arm64 --output-on-failure -E '^oxrsys_pyrowave_tests$'

  swift-packages:
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [OXRSysStreaming, OXRSysSimulator]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build --package-path clients/Apple/common/${{ matrix.package }}
      - name: Test
        if: matrix.package == 'OXRSysStreaming'
        run: swift test --package-path clients/Apple/common/${{ matrix.package }}
      - name: Test, unchecked without a test target
        if: matrix.package != 'OXRSysStreaming'
        run: echo "UNCHECKED 1 - ${{ matrix.package }} has no test target; it is built only"

  apps:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: SDKs
        run: xcodebuild -showsdks
      - name: Home
        run: |
          xcodebuild -project "clients/Apple/oxrsys-home/OXRSys Home.xcodeproj" \
            -scheme "OXRSys Home" -configuration Debug \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Simulator
        run: |
          xcodebuild -project "clients/Apple/oxrsys-simulator/OXRSys Simulator.xcodeproj" \
            -scheme "OXRSys Simulator" -configuration Debug \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build
      - name: visionOS
        run: |
          if xcodebuild -showsdks | grep -q xrsimulator; then
            xcodebuild -project "clients/Apple/oxrsys-visionos/OXRSys visionOS.xcodeproj" \
              -scheme "OXRSys visionOS" -configuration Debug \
              -destination 'generic/platform=visionOS Simulator' \
              CODE_SIGNING_ALLOWED=NO build
          else
            echo "UNCHECKED 1 - the visionOS simulator SDK is not installed on this runner; OXRSys visionOS is not built"
          fi
